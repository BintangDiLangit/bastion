name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build every artifact without publishing (snapshot mode)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub Release and upload archives, checksums and packages.
      contents: write
      # Push container images to ghcr.io.
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # GoReleaser needs full history and tags for the changelog and
          # .PreviousTag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Dockerfile.release has a RUN step, so the linux/arm64 leg has to
      # execute under emulation on an amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `goreleaser release` fails when HEAD is not tagged, so a plain
      # workflow_dispatch on a branch would always fail. Snapshot mode builds
      # and renders everything (archives, packages, cask, images) and publishes
      # nothing, which makes the dispatch trigger a real pre-flight check.
      # Dispatching on a tag with dry_run=false is the re-run path when a
      # release fails halfway, without deleting and re-pushing the tag.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            ${{ (github.ref_type == 'tag' && !inputs.dry_run)
                && 'release --clean'
                || 'release --clean --snapshot' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Upload snapshot artifacts
        if: github.ref_type != 'tag' || inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: bastion-snapshot
          path: dist/*
          retention-days: 7

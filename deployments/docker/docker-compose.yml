version: '3.8'

services:
  api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://user:pass@postgres:5432/security_auditor
      - REDIS_URL=redis://redis:6379
      - CONFIG_PATH=/root/configs
    depends_on:
      - postgres
      - redis
    volumes:
      - ../../configs:/root/configs
      
  worker:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    command: ./worker
    environment:
      - DATABASE_URL=postgres://user:pass@postgres:5432/security_auditor
      - REDIS_URL=redis://redis:6379
      - CONFIG_PATH=/root/configs
    depends_on:
      - postgres
      - redis
    volumes:
      - ../../configs:/root/configs
      
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=security_auditor
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
      
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

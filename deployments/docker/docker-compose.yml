services:
  api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "${BASTION_PORT:-8080}:8080"
    environment:
      - CSA_SERVER_API_KEY=${BASTION_API_KEY:?set BASTION_API_KEY}
      - CSA_DATABASE_HOST=postgres
      - CSA_DATABASE_USER=user
      - CSA_DATABASE_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - CSA_DATABASE_DBNAME=security_auditor
      - CSA_REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=security_auditor
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d security_auditor"]
      interval: 2s
      timeout: 3s
      retries: 20
      
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:

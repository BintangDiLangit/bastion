# Bastion API configuration
# Only the API server reads this file. The CLI and the MCP server run without it.

environment: development

server:
  host: "0.0.0.0"
  port: 8080
  api_key: "" # Set via CSA_SERVER_API_KEY
  read_timeout: "30s"
  write_timeout: "30s"
  shutdown_timeout: "10s"
  mode: "release" # debug, release, test

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "" # Set via CSA_DATABASE_PASSWORD
  dbname: "code_security_auditor"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"

git:
  temp_dir: "/tmp/bastion/repos"
  clone_timeout: "5m"
  max_repo_size: 104857600 # 100MB
  supported_hosts: ["github.com", "gitlab.com", "bitbucket.org"]
  clone_depth: 1
  max_concurrent_clones: 5

scanner:
  max_file_size: 1048576 # 1MB
  max_files_per_scan: 1000
  timeout: "30m"
  max_concurrent: 4
  # Empty means every rule runs. Listing IDs here turns this into a filter and
  # silently disables everything not named. Run `bastion rules` for valid IDs.
  enabled_rules: []
  excluded_paths:
    - "vendor/"
    - "node_modules/"
    - ".git/"
    - "__pycache__/"
    - ".idea/"
    - ".vscode/"
    - "dist/"
    - "build/"
  excluded_extensions:
    - ".min.js"
    - ".min.css"
    - ".lock"
    - ".sum"
    - ".map"

logging:
  level: "info" # debug, info, warn, error
  format: "json" # json, text
  output: "stdout" # stdout, file

rate_limit:
  enabled: true
  requests: 100
  window: "1m"
  burst_size: 10

# Security Rules Configuration
# Customize detection rules and their settings

rules:
  # SQL Injection Detection
  sql_injection:
    enabled: true
    severity: critical
    category: injection
    languages:
      - go
      - python
      - javascript
      - typescript
      - java
      - php
      - ruby
      - csharp
    patterns:
      - pattern: '(?i)(SELECT|INSERT|UPDATE|DELETE|DROP|UNION).*\+\s*["'']?\w+["'']?\s*\+'
        description: "String concatenation in SQL query"
        confidence: 0.8
      - pattern: '(?i)(SELECT|INSERT|UPDATE|DELETE).*%[sv]'
        description: "String formatting in SQL query"
        confidence: 0.75

  # Cross-Site Scripting (XSS) Detection
  xss:
    enabled: true
    severity: high
    category: xss
    languages:
      - javascript
      - typescript
      - html
      - php
      - python
      - go
      - java
      - ruby
    patterns:
      - pattern: '(?i)\.innerHTML\s*='
        description: "Direct innerHTML assignment"
        confidence: 0.85
      - pattern: '(?i)document\.write\s*\('
        description: "document.write usage"
        confidence: 0.9

  # Hardcoded Secrets Detection
  secrets:
    enabled: true
    severity: critical
    category: secrets
    languages: []  # All languages
    patterns:
      # API Keys
      - pattern: 'AKIA[0-9A-Z]{16}'
        description: "AWS Access Key ID"
        confidence: 0.95
      - pattern: 'gh[pousr]_[A-Za-z0-9_]{36,}'
        description: "GitHub Token"
        confidence: 0.95
      - pattern: 'xox[baprs]-([0-9a-zA-Z]{10,48})'
        description: "Slack Token"
        confidence: 0.95
      # Private Keys
      - pattern: '-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
        description: "Private Key"
        confidence: 0.95
      # Database URLs
      - pattern: '(?i)postgres(ql)?://[^:]+:[^@]+@[^/]+/[^\s"'']+' 
        description: "PostgreSQL connection string with password"
        confidence: 0.9
    exclusions:
      - "test"
      - "example"
      - "sample"
      - "mock"

  # Vulnerable Dependencies Detection
  dependency:
    enabled: true
    severity: high
    category: dependency
    check_files:
      - "package.json"
      - "package-lock.json"
      - "yarn.lock"
      - "go.mod"
      - "go.sum"
      - "requirements.txt"
      - "Pipfile"
      - "Pipfile.lock"
      - "Gemfile"
      - "Gemfile.lock"
      - "composer.json"
      - "composer.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pom.xml"
      - "build.gradle"

  # Command Injection Detection
  command_injection:
    enabled: true
    severity: critical
    category: injection
    languages:
      - go
      - python
      - javascript
      - typescript
      - java
      - php
      - ruby
    patterns:
      - pattern: '(?i)(exec|system|popen|subprocess|shell_exec|passthru)\s*\([^)]*\+'
        description: "Command execution with string concatenation"
        confidence: 0.85
      - pattern: '(?i)os\.system\s*\('
        description: "os.system usage"
        confidence: 0.8

  # Path Traversal Detection
  path_traversal:
    enabled: true
    severity: high
    category: injection
    patterns:
      - pattern: '(?i)(\.\.\/|\.\.\\)'
        description: "Path traversal attempt"
        confidence: 0.7
      - pattern: '(?i)(readFile|openFile|fopen)\s*\([^)]*\+'
        description: "File operation with string concatenation"
        confidence: 0.75

# Custom rules can be added here
custom_rules: []

# Global exclusions
global_exclusions:
  paths:
    - "vendor/"
    - "node_modules/"
    - ".git/"
    - "__pycache__/"
    - "test/"
    - "tests/"
    - "spec/"
    - "mock/"
    - "fixtures/"
  files:
    - "*.test.*"
    - "*.spec.*"
    - "*_test.go"
    - "*.min.js"
    - "*.min.css"
